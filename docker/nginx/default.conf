server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Liveness endpoint for the container healthcheck. It does not touch the
    # database or any business service.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Docker's embedded DNS. Resolving at request time lets nginx start even
    # when raffles-service is stopped or being recreated independently.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Controlled JSON response while the raffles read service is unavailable.
    location = /api/_raffles_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Catalogo de rifas temporalmente no disponible."}';
    }

    # Controlled JSON response while the auth service is unavailable.
    location = /api/_auth_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Servicio de autenticacion temporalmente no disponible."}';
    }

    # Controlled JSON response while orders-service is unavailable.
    location = /api/_orders_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Servicio de ordenes temporalmente no disponible."}';
    }

    # Controlled JSON response while payments-service is unavailable.
    # Mercado Pago retries a 503, so a stopped service never loses a payment.
    location = /api/_payments_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Servicio de pagos temporalmente no disponible."}';
    }

    # Internal service-to-service routes are never exposed by the gateway.
    location ^~ /internal/ {
        return 404;
    }

    # Authentication service (users, sessions, roles).
    # The monolith keeps validating the same database-backed session, so a
    # session issued here is accepted by existing protected routes.
    location ~ ^/api/(register|login|logout|me|auth/health)$ {
        set $auth_upstream auth-service:9000;
        include fastcgi_params;
        fastcgi_pass $auth_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 10s;
        fastcgi_intercept_errors on;
        error_page 502 503 504 =503 /api/_auth_unavailable;
    }

    # CSRF bootstrap belongs to the auth service (same session contract).
    location = /sanctum/csrf-cookie {
        set $auth_upstream auth-service:9000;
        include fastcgi_params;
        fastcgi_pass $auth_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 10s;
        fastcgi_intercept_errors on;
        error_page 502 503 504 =503 /api/_auth_unavailable;
    }

    # Public read-only raffle catalog (raffles-service).
    # Orders, payments and webhooks remain in the Laravel monolith.
    location ~ ^/api/raffles(?:/[0-9]+(?:/numbers)?)?/?$ {
        set $raffles_upstream raffles-service:80;
        proxy_pass http://$raffles_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /api/_raffles_unavailable;
    }

    # Raffle administration (raffles-service, S2).
    # The service validates the shared Laravel session cookie and the ADMIN
    # role against `sessions`/`users`; it never trusts an identity header.
    # Rollback: delete this location so the paths fall through to the
    # monolith's /api route (same database, no migration needed).
    location ~ ^/api/admin/raffles(?:/.*)?$ {
        set $raffles_admin_upstream raffles-service:80;
        proxy_pass http://$raffles_admin_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        # Do not intercept upstream responses: Laravel returns the non-standard
        # 419 for CSRF mismatches and nginx would rewrite it to 500. Connect
        # failures are generated locally and still map to the controlled 503.
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_raffles_unavailable;
    }

    # Orders and reservations (orders-service, S3).
    # Only POST /api/orders and GET /api/orders/{id} are owned here.
    # Payment sub-routes and webhooks stay in the monolith and fall through to
    # the generic API location below. Rollback: delete both locations so the
    # paths return to the monolith (same database, no migration needed).
    location = /api/orders {
        set $orders_upstream orders-service:80;
        proxy_pass http://$orders_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        # Preserve 419/422/409 from the service; connect failures still map to
        # the controlled 503 through error_page.
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_orders_unavailable;
    }

    # Admin order list (FR-013). Read-only and ADMIN-only in the service.
    location = /api/admin/orders {
        set $orders_upstream orders-service:80;
        proxy_pass http://$orders_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_orders_unavailable;
    }

    location ~ ^/api/orders/[0-9]+$ {
        set $orders_upstream orders-service:80;
        proxy_pass http://$orders_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_orders_unavailable;
    }

    # Payments (payments-service, S4).
    #
    # Only the four payment entry points are owned by the service. The provider
    # webhook must remain reachable while the rest of the platform is degraded,
    # and a 503 asks Mercado Pago to retry (never a silent 200).
    #
    # Rollback: delete these four locations so the paths fall through to the
    # monolith, which keeps equivalent routes and the same data.
    location = /api/webhooks/mercadopago {
        set $payments_upstream payments-service:80;
        proxy_pass http://$payments_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Provider fetch + duplicate search must fit inside Mercado Pago's
        # confirmation window.
        proxy_connect_timeout 2s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_payments_unavailable;
    }

    location ~ ^/api/orders/[0-9]+/payments$ {
        set $payments_upstream payments-service:80;
        proxy_pass http://$payments_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_payments_unavailable;
    }

    location ~ ^/api/orders/[0-9]+/payments/[0-9]+/verify$ {
        set $payments_upstream payments-service:80;
        proxy_pass http://$payments_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_payments_unavailable;
    }

    location ~ ^/api/admin/orders/[0-9]+/payments/[0-9]+/resolve$ {
        set $payments_upstream payments-service:80;
        proxy_pass http://$payments_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_payments_unavailable;
    }

    # Payment incidents list (FR-013). Read-only and ADMIN-only in the service.
    location = /api/admin/payments/incidents {
        set $payments_upstream payments-service:80;
        proxy_pass http://$payments_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /api/_payments_unavailable;
    }

    # API and Sanctum (CSRF cookie) are handled by Laravel through PHP-FPM.
    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_read_timeout 60s;
    }

    # React SPA fallback.
    location / {
        # Keep same-origin Referer so Sanctum recognizes the SPA on GET /api/me
        # (Sanctum treats a request as stateful from Referer/Origin). It is not
        # sent to third parties such as Mercado Pago.
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
