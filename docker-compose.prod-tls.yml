# Optional direct-Nginx TLS overlay. Use ONLY when not terminating TLS at ALB.
#
#   deploy/aws/render-nginx-tls.sh --domain your.domain \
#       --cert /path/fullchain.pem --key /path/privkey.pem
#   TLS_CERT_DIR=/path/to/certs \
#       docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                      -f docker-compose.prod-tls.yml up -d
#
# The certificate and the rendered config are host files, never committed.

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/aws/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
